server.port=8080
server.servlet.context-path=/v3

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://javablog_v3_mysql:3306/v3db?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:v3user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:V3pass1234!}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.madayV3.blog.dto

spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

spring.thymeleaf.cache=false

maria.datasource.url=${MARIA_DATASOURCE_URL:jdbc:mariadb://javablog_v3_mariadb:3306/practicedb}
maria.datasource.username=${MARIA_DATASOURCE_USERNAME:mariauser}
maria.datasource.password=${MARIA_DATASOURCE_PASSWORD:Maria1234!}
maria.datasource.driver-class-name=org.mariadb.jdbc.Driver
