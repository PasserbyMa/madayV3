<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>로그인 - madayV3</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .login-wrap {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 2.5rem;
            width: 360px;
        }
        .login-card h2 { font-size: 1.25rem; margin-bottom: 0.5rem; }
        .login-card p  { color: var(--muted); font-size: 0.85rem; margin-bottom: 2rem; }
        .login-card .form-group { margin-bottom: 1rem; }
        .login-card input {
            width: 100%;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            padding: 0.65rem 0.85rem;
            font-size: 0.9rem;
            outline: none;
        }
        .login-card input:focus { border-color: var(--accent); }
        .login-card label { display: block; font-size: 0.78rem; color: var(--muted); margin-bottom: 0.35rem; }
        .login-card .btn { width: 100%; justify-content: center; padding: 0.7rem; margin-top: 0.5rem; }
        .error-msg { color: var(--danger); font-size: 0.82rem; margin-bottom: 1rem; }
    </style>
</head>
<body>
<div class="login-wrap">
    <div class="login-card">
        <h2>madayV3</h2>
        <p>Spring Boot · MySQL 포트폴리오</p>

        <div th:if="${param.error}" class="error-msg">아이디 또는 비밀번호가 틀렸습니다.</div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label>아이디</label>
                <input type="text" name="username" placeholder="admin" autocomplete="username">
            </div>
            <div class="form-group">
                <label>비밀번호</label>
                <input type="password" name="password" placeholder="••••••••" autocomplete="current-password">
            </div>
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit" class="btn btn-primary">로그인</button>
        </form>
    </div>
</div>
</body>
</html>
