<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>가입현황 - madayV3</title>
    <meta th:name="_csrf"        th:content="${_csrf.token}">
    <meta th:name="_csrf_header" th:content="${_csrf.headerName}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav>
    <a class="nav-brand" th:href="@{/}">madayV3</a>
    <div class="nav-links">
        <a th:href="@{/}">대시보드</a>
        <a th:href="@{/members}">고객 관리</a>
        <a th:href="@{/subscriptions}" class="active">가입현황</a>
    </div>
    <div class="nav-auth">
        <span sec:authorize="isAuthenticated()">
            <span sec:authentication="name"></span> ·
            <a th:href="@{/logout}">로그아웃</a>
        </span>
        <span sec:authorize="!isAuthenticated()">
            <a th:href="@{/login}">로그인</a>
        </span>
    </div>
</nav>

<div class="container">
    <div class="page-header">
        <div>
            <div class="page-title">가입현황</div>
            <div class="page-sub">총 <span th:text="${totalCount}">0</span>건</div>
        </div>
        <button class="btn btn-primary btn-sm" onclick="subModal.openAdd()">+ 가입 등록</button>
    </div>

    <div class="panel">
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>ID</th><th>고객명</th><th>요금제</th><th>월정액</th>
                        <th>시작일</th><th>종료일</th><th>상태</th><th>등록일</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="s : ${subscriptions}" th:onclick="|subModal.openView([[${s.id}]])|">
                        <td th:text="${s.id}" style="color:var(--muted);font-size:0.8rem"></td>
                        <td th:text="${s.memberName}" style="font-weight:500"></td>
                        <td th:text="${s.planName}"></td>
                        <td th:text="${#numbers.formatInteger(s.monthlyFee, 1, 'COMMA') + '원'}" style="color:var(--accent)"></td>
                        <td th:text="${s.startDate}" style="color:var(--muted);font-size:0.8rem"></td>
                        <td th:text="${s.endDate != null ? s.endDate : '-'}" style="color:var(--muted);font-size:0.8rem"></td>
                        <td>
                            <span class="badge"
                                  th:classappend="${s.status == 'ACTIVE'} ? 'badge-active' : (${s.status == 'CANCELLED'} ? 'badge-cancelled' : 'badge-expired')"
                                  th:text="${s.status}"></span>
                        </td>
                        <td th:text="${s.createdAt}" style="color:var(--muted);font-size:0.8rem"></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(subscriptions)}">
                        <td colspan="8" style="text-align:center;color:var(--muted);padding:2rem">데이터 없음</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- 페이지네이션 -->
    <div class="pagination" th:if="${totalPages > 0}">
        <a th:if="${currentPage > 1}" th:href="@{/subscriptions(page=${currentPage-1})}">&laquo;</a>
        <th:block th:each="i : ${#numbers.sequence(1, totalPages)}">
            <a th:href="@{/subscriptions(page=${i})}"
               th:text="${i}"
               th:classappend="${i == currentPage} ? 'active'"></a>
        </th:block>
        <a th:if="${currentPage < totalPages}" th:href="@{/subscriptions(page=${currentPage+1})}">&raquo;</a>
    </div>
</div>

<!-- 가입 모달 -->
<div id="subModal" class="modal-overlay">
    <div class="modal">
        <button class="modal-close" onclick="closeModal('subModal')">✕</button>
        <h3 id="subModalTitle">가입 상세</h3>
        <form id="subForm" onsubmit="return false">
            <input type="hidden" id="subIdField">
            <div class="form-grid">
                <div class="form-group">
                    <label>고객 *</label>
                    <select id="fSubMember">
                        <option value="">선택</option>
                        <option th:each="m : ${members}" th:value="${m.id}" th:text="${m.name}"></option>
                    </select>
                </div>
                <div class="form-group">
                    <label>요금제 *</label>
                    <select id="fSubPlan">
                        <option value="">선택</option>
                        <option th:each="p : ${plans}" th:value="${p.id}"
                                th:text="${p.planName + ' (' + #numbers.formatInteger(p.monthlyFee,1,'COMMA') + '원)'}"></option>
                    </select>
                </div>
                <div class="form-group">
                    <label>시작일 *</label>
                    <input type="date" id="fSubStart">
                </div>
                <div class="form-group">
                    <label>종료일</label>
                    <input type="date" id="fSubEnd">
                </div>
                <div class="form-group full">
                    <label>상태</label>
                    <select id="fSubStatus">
                        <option value="ACTIVE">ACTIVE</option>
                        <option value="CANCELLED">CANCELLED</option>
                        <option value="EXPIRED">EXPIRED</option>
                    </select>
                </div>
            </div>
        </form>
        <div class="modal-footer">
            <button id="btnDeleteSub" class="btn btn-danger btn-sm"
                    onclick="subModal.delete(this.dataset.id)" style="margin-right:auto;display:none">삭제</button>
            <button id="btnEditSub" class="btn btn-secondary btn-sm"
                    onclick="subModal.enableEdit()" style="display:none">수정</button>
            <button id="btnSaveSub" class="btn btn-primary btn-sm"
                    onclick="subModal.save()">저장</button>
            <button class="btn btn-secondary btn-sm" onclick="closeModal('subModal')">닫기</button>
        </div>
    </div>
</div>

<script th:inline="javascript">
    const contextPath = /*[[${#request.contextPath}]]*/ '';
</script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
